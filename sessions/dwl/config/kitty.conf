# Dedicated Kitty profile for the isolated buchhwin dwl session.
font_family      MesloLGS Nerd Font Mono
bold_font        MesloLGS Nerd Font Mono Bold
italic_font      MesloLGS Nerd Font Mono Italic
bold_italic_font MesloLGS Nerd Font Mono Bold Italic
font_size 11.0

window_padding_width 9
hide_window_decorations yes
background_opacity 0.74
dynamic_background_opacity yes

scrollback_lines 100000
wheel_scroll_multiplier 3.0
copy_on_select clipboard

cursor #d0d0d0
cursor_text_color #181818
cursor_shape block
cursor_blink_interval 0.6
selection_foreground #eeeeee
selection_background #505050

foreground #eeeeee
background #181818
color0  #181818
color1  #d16969
color2  #a3be8c
color3  #d7ba7d
color4  #8ca9bf
color5  #b48ead
color6  #88c0d0
color7  #d0d0d0
color8  #606060
color9  #f38ba8
color10 #b8d7a3
color11 #ead49b
color12 #a9c4d7
color13 #ccb2c8
color14 #a6d4dc
color15 #ffffff

enable_audio_bell no
confirm_os_window_close 0
