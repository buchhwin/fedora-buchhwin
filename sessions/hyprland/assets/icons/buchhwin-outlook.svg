<?xml version="1.0" encoding="UTF-8"?>
<!--
  Outlook web app launcher icon. Same reasoning as buchhwin-teams.svg beside it:
  the themed name "outlook" resolves to nothing on a stock Fedora — measured, it
  is not in any installed theme — and the real logo is a trademark that cannot go
  into a public repository.

  An envelope, because that is what the app is for.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#1f6fd0"/>
  <rect x="12" y="19" width="40" height="26" rx="4" fill="#ffffff" opacity="0.95"/>
  <path d="M12 24.5 30.2 36.4a3.4 3.4 0 0 0 3.6 0L52 24.5"
        fill="none" stroke="#1f6fd0" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
